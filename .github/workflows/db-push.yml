name: Prisma DB Push (Cloud Migration)

on:
  # Trigger automatically when schema.prisma changes are pushed
  push:
    branches:
      - main
      - master
    paths:
      - 'prisma/schema.prisma'

  # Also allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "push" to confirm you want to sync schema to Render DB'
        required: true
        default: 'push'

jobs:
  db-push:
    name: Sync Prisma Schema → Render PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔄 Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate

      - name: 🚀 Push schema to Render DB (NO DATA RESET)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "📋 Running prisma db push — this syncs schema ONLY, never drops data."
          echo "✅ Existing student records will NOT be affected."
          npx prisma db push --skip-generate
          echo "✅ Schema sync complete!"

      - name: ✅ Verify connection (schema introspect)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "🔍 Verifying database is reachable and schema is correct..."
          npx prisma db pull --force
          echo "✅ Database connection verified!"
